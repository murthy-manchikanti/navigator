version: '2.3'
name: carla_bridge
services:
    carla_bridge:
        depends_on:
          - scene_observer
        privileged: true
        stdin_open: true
        tty: true
        runtime: nvidia

        image: carla_bridge
        container_name: carla_bridge_${USER}

        volumes:     
          - type: bind
            source: /home/share/carla
            target: /carla
          # /launch is where we store parameter/data files for launching carla and the bridge
          - type: bind
            source: ${PWD}/launch
            target: /launch 
          - type: bind
            source: ${HOME}/.Xauthority
            target: /root/.Xauthority
          - type: bind
            source: /tmp/.X11-unix
            target: /tmp/.X11-unix
          # need to enable shared memory for ros to communicate between docker containers
          # see: https://answers.ros.org/question/370595/ros2-foxy-nodes-cant-communicate-through-docker-container-border/
          - type: bind
            source: /dev/shm
            target: /dev/shm

        environment:
          - DISPLAY=${DISPLAY}
          - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
          - NVIDIA_VISIBLE_DEVICES=all
          # Specify the ROS Middleware to be consistent across containers:
          # see: https://discourse.ros.org/t/ros-cross-distribution-communication/27335
          - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

        build:
          context: .
          dockerfile: Dockerfile
        
        network_mode: "host"

    scene_observer:
        image: carla_bridge
        ipc: host
        restart: unless-stopped
        network_mode: "host"
        environment:
          - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-83}
          - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
        volumes:
          - /home/share/carla:/carla:ro
          - ./carla_scene_observer.py:/observer/carla_scene_observer.py:ro
        entrypoint: ["/bin/bash", "-lc"]
        command:
          - >-
            source /opt/ros/foxy/setup.bash &&
            export PYTHONPATH=/carla/PythonAPI/carla:/carla/PythonAPI/carla/dist/carla-0.9.13-py3.7-linux-x86_64.egg:$$PYTHONPATH &&
            exec python3 /observer/carla_scene_observer.py
